services:
  crm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-crm-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://crm_user:crm_secure_password_2026@crm-db:5432/edx_db
      - REDIS_URL=redis://crm-cache:6379
      - JWT_SECRET=prod_crm_jwt_secret_zero_trust_super_secure_key_2026
      - DATA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - WEBHOOK_HMAC_SECRET=whsec_prod_billing_edx_enterprise_hmac_2026
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      crm-db:
        condition: service_healthy
      crm-cache:
        condition: service_healthy
    networks:
      - edx-internal-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  crm-db:
    image: postgres:16-alpine
    container_name: edx-digital-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=crm_secure_password_2026
      - POSTGRES_DB=edx_db
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - edx-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d edx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-cache:
    image: redis:7-alpine
    container_name: edx-digital-cache
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_secure_pass_2026
    volumes:
      - crm-cache-data:/data
    networks:
      - edx-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edx-internal-net:
    driver: bridge

volumes:
  crm-db-data:
  crm-cache-data:
