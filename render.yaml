services:
  - type: web
    name: nexus-crm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FIREBASE_PROJECT_ID
        value: nexuscrm-d8e13
      # Endereco publico deste servidor: o Mercado Pago avisa os pagamentos aqui
      - key: PUBLIC_API_URL
        value: https://nexus-crm-yfof.onrender.com
      # Os tres abaixo sao segredos: preencha no painel do Render, nunca neste arquivo.
      # Passo a passo em docs/COBRANCA_PIX.md
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
